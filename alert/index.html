<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teduh — Order Alert</title>
<link rel="manifest" href="/alert/manifest.json">
<meta name="theme-color" content="#2b1c14">
<link rel="icon" href="/alert/icons/icon-192.png">
<link rel="apple-touch-icon" href="/alert/icons/icon-192.png">
<style>
  :root {
    --dark-brown: #2b1c14;
    --medium-brown: #6b5344;
    --accent: #c0783c;
    --alert-red: #c0392b;
    --success: #3a7d44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body {
    background: var(--dark-brown);
    color: #fff;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease;
  }
  body.alerting {
    animation: flash 1s infinite;
    align-items: center;
    justify-content: center;
  }
  @keyframes flash {
    0%, 100% { background: var(--alert-red); }
    50% { background: #7a1f16; }
  }

  /* Dashboard (idle) state — full-height layout: top bar, filter tabs, queue list */
  #idle-screen {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
  }
  body.alerting #idle-screen { display: none; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
    gap: 0.6rem;
  }
  .top-bar .logo { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
  .status-line { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #cbb8a8; white-space: nowrap; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .status-dot.disconnected { background: var(--alert-red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .top-bar .right-controls { display: flex; align-items: center; gap: 0.5rem; }
  #clock { font-size: 0.8rem; color: #a68f7c; white-space: nowrap; }
  .icon-btn {
    padding: 0.45rem 0.7rem;
    border-radius: 8px;
    border: 1px solid #6b5344;
    background: transparent;
    color: #cbb8a8;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .icon-btn:active { background: rgba(255,255,255,0.08); }
  #notif-btn { border-color: var(--accent); background: rgba(192,120,60,0.2); color: #ffd9b3; }

  .filter-tabs {
    display: flex;
    gap: 0.4rem;
    padding: 0.6rem 1.1rem;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .filter-tab {
    padding: 0.45rem 1rem;
    border-radius: 999px;
    border: 1px solid #6b5344;
    background: transparent;
    color: #cbb8a8;
    font-size: 0.82rem;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #queue-list {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .empty-state { text-align: center; color: #8a7364; padding: 3rem 1rem; font-size: 0.95rem; }

  .queue-card {
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    border-left: 4px solid var(--medium-brown);
  }
  .queue-card.status-pending { border-left-color: var(--accent); }
  .queue-card.status-preparing { border-left-color: #d4a545; }
  .queue-card.status-ready { border-left-color: var(--success); }
  .queue-card.status-delivering { border-left-color: #4a90d9; }
  .queue-card.status-done { opacity: 0.5; }

  .qc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.4rem; }
  .qc-number { font-size: 1.25rem; font-weight: 800; }
  .qc-type { font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 999px; margin-left: 0.5rem; font-weight: 600; }
  .qc-type.pickup { background: rgba(192,120,60,0.3); color: #ffd9b3; }
  .qc-type.delivery { background: rgba(74,144,217,0.3); color: #b8d9ff; }
  .qc-status-badge { font-size: 0.72rem; padding: 0.3rem 0.7rem; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .badge-pending { background: rgba(192,120,60,0.3); color: #ffd9b3; }
  .badge-preparing { background: rgba(212,165,69,0.3); color: #ffe9b3; }
  .badge-ready { background: rgba(58,125,68,0.3); color: #b3ffc0; }
  .badge-delivering { background: rgba(74,144,217,0.3); color: #b8d9ff; }
  .badge-done { background: rgba(255,255,255,0.1); color: #ccc; }

  .qc-customer { font-size: 0.92rem; color: #e8dcd0; margin-bottom: 0.3rem; }
  .qc-items { font-size: 0.82rem; color: #cbb8a8; margin-bottom: 0.4rem; }
  .qc-item-row { line-height: 1.5; }
  .qc-meta { font-size: 0.74rem; color: #a68f7c; margin-bottom: 0.6rem; }
  .qc-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .qc-btn {
    padding: 0.55rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--medium-brown);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .qc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .prepare-btn { background: var(--accent); border-color: var(--accent); }
  .ready-btn { background: #d4a545; border-color: #d4a545; color: #2b1c14; }
  .done-btn, .deliver-btn { background: var(--success); border-color: var(--success); }
  .wa-btn { background: #25D366; border-color: #25D366; color: #0b1f10; }
  .revert-btn { background: transparent; opacity: 0.7; padding: 0.55rem 0.8rem; }

  #print-debug-log {
    flex-shrink: 0;
    max-height: 110px;
    overflow-y: auto;
    background: rgba(0,0,0,0.35);
    padding: 0.5rem 1rem;
    font-size: 0.68rem;
    font-family: monospace;
    color: #8fae8f;
    white-space: pre-wrap;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* Alert state */
  #alert-screen { display: none; width: 100%; max-width: 720px; padding: 2rem; text-align: center; }
  body.alerting #alert-screen { display: block; }
  body.alerting #idle-screen { display: none; }

  #alert-screen .badge {
    display: inline-block;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }
  #alert-screen .queue-num { font-size: 5rem; font-weight: 800; line-height: 1; margin: 0.3rem 0; }
  #alert-screen .order-type { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.3rem; }
  #alert-screen .pickup-time { font-size: 1.3rem; color: #ffe1d6; margin-bottom: 1rem; }
  #alert-screen .customer { font-size: 1.3rem; margin-bottom: 1.2rem; }
  #alert-screen .customer .phone { opacity: 0.85; font-size: 1.05rem; }
  #alert-screen .items-box {
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    text-align: left;
    font-size: 1.15rem;
    line-height: 1.6;
    max-height: 30vh;
    overflow-y: auto;
    margin-bottom: 1rem;
  }
  #alert-screen .address-box { font-size: 1rem; opacity: 0.9; margin-bottom: 1rem; }
  #alert-screen .notes-box { font-size: 1rem; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 0.6rem 1rem; margin-bottom: 1.2rem; }
  #queue-remaining { font-size: 0.95rem; opacity: 0.85; margin-bottom: 1rem; }

  #ack-btn {
    width: 100%;
    padding: 1.3rem;
    font-size: 1.5rem;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    background: #fff;
    color: var(--alert-red);
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  #ack-btn:active { transform: scale(0.98); }

  #wake-lock-warning {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.12); padding: 0.5rem 1rem; border-radius: 10px;
    font-size: 0.85rem; color: #ffcf99; display: none;
  }

  /* In-app toast — replaces native alert() popups so errors/confirmations
     feel like part of the app instead of a jarring browser dialog. */
  #toast-container {
    position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem;
    align-items: center; pointer-events: none;
  }
  .toast {
    padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.9rem;
    max-width: 90vw; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    animation: toast-in 0.2s ease-out;
  }
  .toast.error { background: var(--alert-red); color: #fff; }
  .toast.success { background: var(--success); color: #fff; }
  .toast.info { background: rgba(255,255,255,0.15); color: #fff; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="toast-container"></div>

  <div id="idle-screen">
    <div class="top-bar">
      <div class="logo">TEDUH</div>
      <div class="status-line"><span id="status-dot" class="status-dot"></span><span id="status-text">Connecting…</span></div>
      <div class="right-controls">
        <span id="clock"></span>
        <button id="test-btn" class="icon-btn" onclick="testAlarm()" title="Test Alarm">🔊</button>
        <button id="print-test-btn" class="icon-btn" onclick="testPrint()" title="Test Print">🖨️</button>
        <button id="notif-btn" class="icon-btn" onclick="requestNotificationPermission()" style="display:none;" title="Enable Notifications">🔔</button>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterQueue('all', this)">All</button>
      <button class="filter-tab" onclick="filterQueue('pending', this)">Pending</button>
      <button class="filter-tab" onclick="filterQueue('preparing', this)">Preparing</button>
      <button class="filter-tab" onclick="filterQueue('ready', this)">Ready</button>
      <button class="filter-tab" onclick="filterQueue('delivering', this)">Delivering</button>
      <button class="filter-tab" onclick="filterQueue('done', this)">Done</button>
    </div>

    <div id="queue-list"><div class="empty-state">Loading queue…</div></div>

    <div id="print-debug-log"></div>
  </div>

  <div id="alert-screen">
    <div class="badge" id="al-badge">NEW ORDER</div>
    <div class="queue-num" id="al-queue">—</div>
    <div class="order-type" id="al-type"></div>
    <div class="pickup-time" id="al-pickup" style="display:none;"></div>
    <div class="customer">
      <div id="al-name"></div>
      <div class="phone" id="al-phone"></div>
    </div>
    <div class="items-box" id="al-items"></div>
    <div class="address-box" id="al-address" style="display:none;"></div>
    <div class="notes-box" id="al-notes" style="display:none;"></div>
    <div id="queue-remaining"></div>
    <button id="ack-btn" onclick="acknowledgeCurrent()">✓ ACKNOWLEDGE</button>
  </div>

  <div id="wake-lock-warning">⚠ Screen may sleep — check your PC's power settings so this stays on.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/alert/imin-print-web.js"></script>
<script>
// ── Config ─────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://nazkkichtnanodrgdyff.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hemtraWNodG5hbm9kcmdkeWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjA5MjIsImV4cCI6MjA5MTI5NjkyMn0.GesVlIsTmtkoDUkhPkQtOGUz2gyV2EtAN5QXIrR9il0';

let alertQueue = [];   // orders waiting to be acknowledged, oldest first
let alarmTimer = null;
let audioCtx = null;

// ── Queue dashboard state ────────────────────────────────────────────
let allQueue = [];
let queueFilter = 'all';

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'return=representation',
      ...(options.headers || {})
    }
  });
  const text = await res.text();
  if (!res.ok) {
    throw new Error('Request failed (' + res.status + '): ' + (text || res.statusText));
  }
  // Requests sent with Prefer: return=minimal come back with an empty body
  // (204 No Content) on success — parsing that as JSON would throw even
  // though the update actually worked, so only parse when there's content.
  return text ? JSON.parse(text) : null;
}

async function loadQueue() {
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const data = await sbFetch('queue_orders?select=*&order=created_at.desc&created_at=gte.' + today.toISOString());
    allQueue = Array.isArray(data) ? data : [];
    renderQueue();
  } catch (e) {
    printLog('Could not load queue: ' + (e && e.message ? e.message : e));
    const el = document.getElementById('queue-list');
    if (el) el.innerHTML = '<div class="empty-state">Could not load queue.</div>';
  }
}

function filterQueue(status, btn) {
  queueFilter = status;
  document.querySelectorAll('.filter-tab').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  renderQueue();
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  if (!list) return;
  const filtered = queueFilter === 'all' ? allQueue : allQueue.filter((o) => o.status === queueFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No orders' + (queueFilter !== 'all' ? ' · ' + queueFilter : ' today') + '.</div>';
    return;
  }
  list.innerHTML = filtered.map((o) => {
    const isPU = o.queue_number && o.queue_number.startsWith('#PO');
    const typeLabel = isPU ? 'Pickup' : 'Delivery';
    const typeClass = isPU ? 'pickup' : 'delivery';
    const timeStr = new Date(o.created_at).toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    const status = o.status || 'pending';
    let itemsHtml = '';
    if (o.items) {
      const itemList = o.items.split(',').map((i) => i.trim());
      itemsHtml = '<div class="qc-items">' + itemList.map((i) => '<div class="qc-item-row">· ' + i + '</div>').join('') + '</div>';
    }
    const badgeClass = 'badge-' + status;
    const badgeLabel = status === 'delivering' ? 'Rider Picked Up' : status === 'done' ? (isPU ? 'Picked Up' : 'Delivered') : status.charAt(0).toUpperCase() + status.slice(1);
    let actions = '';
    if (status === 'pending') {
      actions = '<button class="qc-btn prepare-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'preparing\')">Start Preparing</button>';
    } else if (status === 'preparing') {
      actions = '<button class="qc-btn ready-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'ready\')">' + (isPU ? 'Mark Ready' : 'Packed') + '</button>' +
        '<button class="qc-btn revert-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'pending\')">↩</button>';
    } else if (status === 'ready') {
      if (isPU) {
        actions = '<button class="qc-btn wa-btn" onclick="waOrderReady(\'' + o.queue_number + '\',\'' + o.phone + '\',\'' + o.customer_name + '\',\'pickup\')">WA Customer</button>' +
          '<button class="qc-btn done-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'done\')">Customer Picked Up ✓</button>' +
          '<button class="qc-btn revert-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'preparing\')">↩</button>';
      } else {
        const hasCoords = o.delivery_lat && o.delivery_lng;
        const dispatchBtn = hasCoords
          ? '<button class="qc-btn" style="background:#FF6B35;color:white;border-color:#FF6B35;" onclick="dispatchLalamove(\'' + o.id + '\',\'' + o.customer_name + '\',\'' + o.phone + '\',' + o.delivery_lat + ',' + o.delivery_lng + ',\'' + (o.address || '').replace(/'/g, "\\'") + '\')">🛵 Dispatch</button>'
          : '<button class="qc-btn" disabled title="No coordinates saved">🛵 No coords</button>';
        actions = dispatchBtn +
          '<button class="qc-btn deliver-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'delivering\')">Rider Picked Up ✓</button>' +
          '<button class="qc-btn revert-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'preparing\')">↩</button>';
      }
    } else if (status === 'delivering') {
      actions = '<button class="qc-btn wa-btn" onclick="waOrderReady(\'' + o.queue_number + '\',\'' + o.phone + '\',\'' + o.customer_name + '\',\'delivery\')">WA Customer</button>' +
        '<button class="qc-btn done-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'done\')">Delivered ✓</button>' +
        '<button class="qc-btn revert-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'delivering\')">↩</button>';
    } else if (status === 'done') {
      actions = '<button class="qc-btn revert-btn" onclick="updateQueueStatus(\'' + o.id + '\',\'ready\')">↩ Reopen</button>';
    }
    let metaLine = typeLabel + ' · ' + timeStr;
    if (isPU && o.pickup_time) metaLine += ' · 🕐 Pickup requested: ' + o.pickup_time;
    if (!isPU && o.address) metaLine += ' · ' + o.address.substring(0, 40);
    if (o.notes) metaLine += ' · Note: ' + o.notes;
    return '<div class="queue-card status-' + status + '">' +
      '<div class="qc-header">' +
        '<div><span class="qc-number">' + (o.queue_number || '—') + '</span><span class="qc-type ' + typeClass + '">' + typeLabel + '</span></div>' +
        '<span class="qc-status-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '</div>' +
      '<div class="qc-customer">' + o.customer_name + ' · ' + o.phone + '</div>' +
      itemsHtml +
      '<div class="qc-meta">' + metaLine + '</div>' +
      '<div class="qc-actions">' + actions + '</div>' +
    '</div>';
  }).join('');
}

async function updateQueueStatus(id, status) {
  try {
    await sbFetch('queue_orders?id=eq.' + id, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ status }) });
    const idx = allQueue.findIndex((o) => o.id === id);
    if (idx > -1) allQueue[idx].status = status;
    renderQueue();
  } catch (e) {
    toast('Could not update status. Try again.', 'error');
  }
}

function waOrderReady(queueNum, phone, name, type) {
  let cleanPhone = phone.replace(/[^0-9]/g, '');
  if (cleanPhone.startsWith('0')) cleanPhone = '6' + cleanPhone;
  const msg = type === 'pickup'
    ? 'Hi ' + name + '! Pesanan anda ' + queueNum + ' sudah sedia untuk diambil di Teduh, No 11 Jalan Sulaiman, Muar. Sila tunjukkan nombor giliran anda kepada staff. Terima kasih!'
    : 'Hi ' + name + '! Pesanan anda ' + queueNum + ' sedang dalam perjalanan ke alamat anda. Rider kami akan tiba tidak lama lagi. Terima kasih kerana memesan di Teduh!';
  window.open('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank');
}

async function dispatchLalamove(orderId, customerName, customerPhone, deliveryLat, deliveryLng, deliveryAddress) {
  if (!confirm('Dispatch Lalamove rider for ' + customerName + '?')) return;
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/lalamove-dispatch', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, customerName, customerPhone, deliveryLat, deliveryLng, deliveryAddress }),
    });
    const data = await res.json();
    if (!res.ok) { toast('Dispatch failed: ' + (data.error || 'Unknown error'), 'error'); return; }
    toast('Rider dispatched! Tracking link saved.', 'success');
    loadQueue();
  } catch (e) {
    toast('Dispatch failed: ' + e.message, 'error');
  }
}

// ── Clock ──────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000);
tickClock();

// ── Alarm sound (generated tone, no external audio file needed) ────
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.value = 0.3;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); }, 220);
  } catch (e) { console.warn('Audio error:', e); }
}

function startAlarmLoop() {
  if (alarmTimer) return;
  beep();
  alarmTimer = setInterval(beep, 700);
}

function stopAlarmLoop() {
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}

function testAlarm() {
  beep();
  setTimeout(beep, 700);
  setTimeout(beep, 1400);
}

// ── Rendering ──────────────────────────────────────────────────────
function renderCurrentAlert() {
  if (!alertQueue.length) {
    document.body.classList.remove('alerting');
    stopAlarmLoop();
    return;
  }
  document.body.classList.add('alerting');
  startAlarmLoop();

  const o = alertQueue[0];
  const isPickup = (o.fulfillment_type || 'pickup') !== 'delivery';

  document.getElementById('al-queue').textContent = o.queue_number || '—';
  document.getElementById('al-type').textContent = isPickup ? '🥡 Pickup Order' : '🛵 Delivery Order';

  const pickupEl = document.getElementById('al-pickup');
  if (isPickup && o.pickup_time) {
    pickupEl.style.display = 'block';
    pickupEl.textContent = 'Requested: ' + o.pickup_time;
  } else {
    pickupEl.style.display = 'none';
  }

  document.getElementById('al-name').textContent = o.customer_name || '';
  document.getElementById('al-phone').textContent = o.phone || '';
  document.getElementById('al-items').innerHTML = (o.items || '')
    .split(', ')
    .map(i => '· ' + i)
    .join('<br>');

  const addrEl = document.getElementById('al-address');
  if (!isPickup && o.address) {
    addrEl.style.display = 'block';
    addrEl.textContent = '📍 ' + o.address;
  } else {
    addrEl.style.display = 'none';
  }

  const notesEl = document.getElementById('al-notes');
  if (o.notes) {
    notesEl.style.display = 'block';
    notesEl.textContent = 'Note: ' + o.notes;
  } else {
    notesEl.style.display = 'none';
  }

  const remaining = alertQueue.length - 1;
  document.getElementById('queue-remaining').textContent =
    remaining > 0 ? (remaining + ' more order' + (remaining > 1 ? 's' : '') + ' waiting') : '';
}

// ── Acknowledge ────────────────────────────────────────────────────
async function acknowledgeCurrent() {
  if (!alertQueue.length) return;
  const o = alertQueue[0];
  alertQueue.shift();
  renderCurrentAlert();

  try {
    await fetch(`${SUPABASE_URL}/rest/v1/queue_orders?id=eq.${o.id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ alert_acknowledged: true }),
    });
  } catch (e) {
    console.error('Failed to mark acknowledged:', e);
  }
  loadQueue();
}

function pushAlert(order) {
  if (alertQueue.find(o => o.id === order.id)) return; // avoid duplicates
  alertQueue.push(order);
  renderCurrentAlert();
  fireOsNotification(order);
  // Note: printing no longer happens here — see maybeAutoPrint(), which
  // fires once loyverse_synced flips true so the printed ticket and the
  // Loyverse sale record can never go out of sync.
}

// ── Auto-print via iMin's built-in printer ──────────────────────────
// Connects to the iMinprinterplugin app's local WebSocket bridge
// (ws://127.0.0.1:8081) and prints a ticket for the order — fully
// automatic, no staff action required. If the plugin/printer isn't
// available (e.g. testing this page on a non-iMin device), this just
// logs a warning and the rest of the alert still works normally.
let iminPrinter = null;
let printerReady = false;

// ── In-app toast (replaces native alert() popups) ───────────────────
function toast(message, type) {
  const container = document.getElementById('toast-container');
  if (!container) { console.log('[toast]', message); return; }
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, 3500);
}

function printLog(msg) {
  const el = document.getElementById('print-debug-log');
  const time = new Date().toLocaleTimeString('en-MY', { hour12: false });
  console.log('[print]', msg);
  if (el) {
    el.textContent += '[' + time + '] ' + msg + '\n';
    el.scrollTop = el.scrollHeight;
  }
}

async function ensurePrinterConnected() {
  if (typeof IminPrinterWeb === 'undefined') {
    printLog('ERROR: imin-print-web.js did not load (IminPrinterWeb is undefined)');
    return false;
  }
  if (printerReady && iminPrinter && iminPrinter.isConnected()) {
    printLog('Already connected, reusing connection');
    return true;
  }
  try {
    printLog('Connecting to ws://127.0.0.1:8081/websocket ...');
    if (!iminPrinter) iminPrinter = new IminPrinterWeb();
    if (!iminPrinter.isConnected()) await iminPrinter.connect();
    printLog('WebSocket connected. Sending initPrinter(USB)...');
    iminPrinter.initPrinter('USB'); // Falcon's built-in printer uses USB internally
    printerReady = true;
    printLog('Printer initialized OK');
    return true;
  } catch (e) {
    printLog('ERROR connecting to printer: ' + (e && e.message ? e.message : JSON.stringify(e)));
    printerReady = false;
    return false;
  }
}

async function testPrint() {
  printLog('--- Manual test print triggered ---');
  await printReceipt({
    queue_number: 'TEST',
    fulfillment_type: 'pickup',
    pickup_time: 'now',
    customer_name: 'Test Print',
    phone: '',
    items: 'Test Item x1',
    notes: '',
  });
}

async function printReceipt(order) {
  printLog('printReceipt() called for order #' + (order.queue_number || '?'));
  const ok = await ensurePrinterConnected();
  if (!ok) { printLog('Skipping print — printer not available'); return; }

  const p = iminPrinter;
  const isPickup = (order.fulfillment_type || 'pickup') !== 'delivery';

  try {
    const status = await p.getPrinterStatus('USB');
    printLog('Printer status: ' + JSON.stringify(status));

    printLog('Sending print commands...');
    p.setAlignment(1); // center
    p.setTextStyle(1); // bold
    p.setTextSize(40);
    p.printText('TEDUH COFFEE ROASTERY');

    p.setTextStyle(0);
    p.setTextSize(24);
    p.printText('--------------------------------');

    p.setAlignment(0); // left
    p.setTextStyle(1);
    p.setTextSize(32);
    p.printText('Order #' + (order.queue_number || ''));

    p.setTextStyle(0);
    p.setTextSize(26);
    p.printText((isPickup ? 'PICKUP' : 'DELIVERY') + (order.pickup_time ? '  ' + order.pickup_time : ''));
    if (order.customer_name) p.printText('Customer: ' + order.customer_name);
    if (order.phone) p.printText('Phone: ' + order.phone);
    if (!isPickup && order.address) p.printText('Address: ' + order.address);

    p.printText('--------------------------------');

    const items = (order.items || '').split(', ').filter(Boolean);
    items.forEach((item) => p.printText(item));

    p.printText('--------------------------------');

    if (order.notes) {
      p.setTextStyle(2); // italic
      p.printText('Note: ' + order.notes);
      p.setTextStyle(0);
    }

    p.setAlignment(1);
    p.setTextSize(20);
    p.printText(new Date().toLocaleString('en-MY'));

    p.printAndFeedPaper(60);
    p.partialCut();
    printLog('All print commands sent successfully');

    try {
      await sbFetch('queue_orders?id=eq.' + order.id, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({ printed_at: new Date().toISOString() }),
      });
    } catch (markErr) {
      printLog('Could not mark printed_at (will retry on next backfill): ' + markErr.message);
    }
  } catch (e) {
    printLog('ERROR during print: ' + (e && e.message ? e.message : JSON.stringify(e)));
  }
}

// ── Auto-print trigger: fires once Loyverse confirms the sale ──────
// (loyverse_synced flips true), not the moment the order first arrives.
function maybeAutoPrint(order) {
  if (order && order.loyverse_synced && !order.printed_at) {
    printReceipt(order);
  }
}

async function backfillMissedPrints() {
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/queue_orders?loyverse_synced=eq.true&printed_at=is.null&created_at=gte.${today.toISOString()}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const rows = await res.json();
    if (Array.isArray(rows)) rows.forEach(maybeAutoPrint);
  } catch (e) {
    printLog('Backfill print check failed: ' + (e && e.message ? e.message : e));
  }
}

// ── Native OS notification (pops up even if this window is covered by
// another app like the Loyverse POS software) ──────────────────────
function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then((perm) => {
    updateNotifButtonVisibility();
    if (perm === 'granted') setupPush();
  });
}

function updateNotifButtonVisibility() {
  const btn = document.getElementById('notif-btn');
  if (!btn) return;
  const supported = 'Notification' in window;
  btn.style.display = (supported && Notification.permission === 'default') ? 'inline-block' : 'none';
}
updateNotifButtonVisibility();

// ── Web Push subscription ───────────────────────────────────────────
// This is the layer that survives the tab being frozen/backgrounded —
// Chrome delivers push events to the service worker independently of
// whether this page is open, visible, or even running at all (as long
// as the browser application itself is running somewhere).
const VAPID_PUBLIC_KEY = 'BOX55ZjsJ20XbmCQl3cg5sL9QqyHhH8jDERp45iwvxsKZ51AGSymdG03spQJHgjA0g6oWXPnDDZ86WNNnn7IlZ4';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.warn('Push not supported in this browser');
    return;
  }
  if (Notification.permission !== 'granted') return;

  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    const subJson = sub.toJSON();
    await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify({
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth,
      }),
    });
    console.log('Push subscription active');
  } catch (e) {
    console.error('Push setup failed:', e);
  }
}

// If permission was already granted on a previous visit, re-subscribe
// automatically without needing another click.
if ('Notification' in window && Notification.permission === 'granted') {
  setupPush();
}

function fireOsNotification(order) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const isPickup = (order.fulfillment_type || 'pickup') !== 'delivery';
  const n = new Notification('🔔 New order — #' + (order.queue_number || ''), {
    body: (isPickup ? 'Pickup' : 'Delivery') +
      (order.pickup_time ? ' · ' + order.pickup_time : '') +
      '\n' + (order.customer_name || '') +
      '\n' + (order.items || ''),
    requireInteraction: true, // stays on screen until dismissed, doesn't auto-vanish
    tag: 'teduh-order-' + order.id, // avoid stacking duplicate notifications for the same order
  });
  n.onclick = () => { window.focus(); n.close(); };
}

// ── Backfill: catch anything missed while offline/reloading ────────
async function backfillMissedOrders() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/queue_orders?alert_acknowledged=eq.false&order=created_at.asc&select=*`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const rows = await res.json();
    if (Array.isArray(rows)) rows.forEach(pushAlert);
  } catch (e) {
    console.error('Backfill error:', e);
  }
}

// ── Realtime connection ──────────────────────────────────────────
function setStatus(connected) {
  document.getElementById('status-dot').classList.toggle('disconnected', !connected);
  document.getElementById('status-text').textContent = connected ? 'Connected — listening for orders' : 'Reconnecting…';
}

function connectRealtime() {
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const channel = supabase
    .channel('order-alert-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'queue_orders' }, (payload) => {
      pushAlert(payload.new);
      loadQueue();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'queue_orders' }, (payload) => {
      maybeAutoPrint(payload.new);
      loadQueue();
    })
    .subscribe((status) => {
      setStatus(status === 'SUBSCRIBED');
      if (status === 'SUBSCRIBED') { backfillMissedOrders(); backfillMissedPrints(); loadQueue(); }
    });

  // Safety net: re-check for anything missed / any status changes every 30s
  // in case a realtime event is ever dropped (network blip, etc.)
  setInterval(() => { backfillMissedOrders(); backfillMissedPrints(); loadQueue(); }, 30000);
}

// ── Keep screen awake ──────────────────────────────────────────────
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      const lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => {
        document.getElementById('wake-lock-warning').style.display = 'block';
      });
    } else {
      document.getElementById('wake-lock-warning').style.display = 'block';
    }
  } catch (e) {
    document.getElementById('wake-lock-warning').style.display = 'block';
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
requestWakeLock();

// A user gesture is required before browsers allow audio — clicking Test
// Alarm also "unlocks" audio for the automatic alerts that follow.
document.body.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}, { once: true });

connectRealtime();
loadQueue();
</script>
